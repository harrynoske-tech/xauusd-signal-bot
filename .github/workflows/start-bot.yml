name: V11.8 Continuous Live Signal Bot

on:
  workflow_dispatch:

jobs:
  live-signal-bot:
    runs-on: ubuntu-latest

    # GitHub Actions has a maximum job runtime.
    # The Python process itself is continuous.
    timeout-minutes: 350

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ======================================================
      # DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests dukascopy-python


      # ======================================================
      # DOWNLOAD INITIAL HISTORICAL DATA
      # ======================================================

      - name: Download initial Dukascopy data
        run: |
          python dukascopy_data.py


      # ======================================================
      # START CONTINUOUS LIVE BOT
      # ======================================================

      - name: Start continuous V11.8 live bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -u live.py
