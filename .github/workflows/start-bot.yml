name: Start Signal Bot

on:
  workflow_dispatch:

jobs:

  start-bot:

    runs-on: ubuntu-latest

    steps:

      - name: Send Telegram startup message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |

          python - <<'PY'
          import os
          import requests

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          message = """🟢 SIGNALS BOT LIVE

V11.8 Multi-Market Signal Bot is now online.

Markets:
• XAUUSD
• EURUSD

Frequency:
Every 15 minutes

Execution:
Manual MT5

Status:
🟢 Monitoring for signals"""

          url = (
              f"https://api.telegram.org/"
              f"bot{token}/sendMessage"
          )

          response = requests.post(
              url,
              json={
                  "chat_id": chat_id,
                  "text": message,
              },
              timeout=20,
          )

          response.raise_for_status()

          print("Telegram startup message sent.")
          PY
