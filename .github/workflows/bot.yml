name: XAUUSD Strategy Backtest

on:
  workflow_dispatch:

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pandas requests dukascopy-python

      - name: Download Dukascopy XAUUSD data
        run: |
          python dukascopy_data.py

      - name: Run backtest
        run: |
          python backtest.py
