name: XAUUSD Strategy Backtest

on:
  workflow_dispatch:

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests pandas yfinance curl_cffi

      - name: Test FCS API
        env:
          FCS_API_KEY: ${{ secrets.FCS_API_KEY }}
        run: |
          python fcs_test.py

      - name: Run FCS XAUUSD backtest
        env:
          FCS_API_KEY: ${{ secrets.FCS_API_KEY }}
        run: |
          python backtest.py
