name: XAUUSD Strategy Optimizer

on:
  workflow_dispatch:

jobs:
  run-optimizer:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pandas numpy requests dukascopy-python

      - name: Download Dukascopy data
        run: |
          python dukascopy_data.py
          python eurusd_data.py

      - name: Run optimizer
        run: |
          python optimizer.py

      - name: Upload optimizer results
        uses: actions/upload-artifact@v4
        with:
          name: optimizer-results
          path: data/optimizer_results.csv
