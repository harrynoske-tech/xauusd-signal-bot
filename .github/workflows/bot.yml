name: V11.8 Multi-Market Signal Bot

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

jobs:
  signal-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 14

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests dukascopy-python

      - name: Download fresh market data
        run: |
          python dukascopy_data.py

      - name: Run V11.8 signal bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python signal_bot.py
