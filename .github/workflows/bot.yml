name: V11.8 Telegram Signal Bot

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

jobs:

  signal-bot:

    runs-on: ubuntu-latest

    timeout-minutes: 14

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ======================================================
      # DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests dukascopy-python


      # ======================================================
      # RESTORE SIGNAL STATE
      # ======================================================

      - name: Restore signal state
        uses: actions/cache/restore@v4
        with:
          path: data/signal_bot_state.txt
          key: signal-state-${{ github.run_id }}
          restore-keys: |
            signal-state-


      # ======================================================
      # DOWNLOAD FRESH MARKET DATA
      # ======================================================

      - name: Download market data
        run: |
          python dukascopy_data.py


      # ======================================================
      # RUN SIGNAL BOT
      # ======================================================

      - name: Run V11.8 signal bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python signal_bot.py


      # ======================================================
      # SAVE SIGNAL STATE
      # ======================================================

      - name: Save signal state
        uses: actions/cache/save@v4
        with:
          path: data/signal_bot_state.txt
          key: signal-state-${{ github.run_id }}
