name: XAUUSD Strategy Backtest

on:
  workflow_dispatch:

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pandas numpy

      - name: Run backtest
        run: |
          python backtest.py

      - name: Run V8 analysis
        run: |
          python analyze_v8.py
